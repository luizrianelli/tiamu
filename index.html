<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uma pergunta pra você 💖</title>
<style>
  :root {
    --bg-1: #4a0008;
    --bg-2: #1a0003;
    --card: #e8e6fb;
    --texto: #2b2b3a;
    --sim: #1fa64a;
    --nao: #e0334c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Poppins", "Segoe UI", system-ui, sans-serif;
    background: radial-gradient(circle at 50% 20%, var(--bg-1), var(--bg-2) 75%);
    color: var(--texto);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    overflow: hidden;
    min-height: 100dvh;
  }

  /* corações flutuando ao fundo */
  #fundo { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .coracao {
    position: absolute;
    bottom: -40px;
    animation: subir linear forwards;
    filter: drop-shadow(0 0 6px rgba(255, 60, 90, .7));
  }
  @keyframes subir {
    to { transform: translateY(-115vh) rotate(25deg); opacity: 0; }
  }

  /* cartão principal */
  .cartao {
    position: relative;
    z-index: 1;
    width: min(92vw, 560px);
    background: var(--card);
    border-radius: 56px;
    padding: clamp(24px, 6vw, 44px) clamp(18px, 5vw, 36px);
    text-align: center;
    box-shadow: 0 20px 60px rgba(0, 0, 0, .5);
    overflow: hidden;
  }
  .figura {
    font-size: clamp(72px, 22vw, 120px);
    line-height: 1;
    margin-bottom: 14px;
    display: inline-block;
    animation: balanco 2.4s ease-in-out infinite;
  }
  .figura img { max-width: 170px; width: 40vw; border-radius: 12px; }
  @keyframes balanco {
    50% { transform: translateY(-6px) rotate(-3deg); }
  }
  .midia {
    display: block;
    width: min(62vw, 260px);
    height: auto;
    margin: 0 auto 14px;
    border-radius: 18px;
    background: #fff;
    box-shadow: 0 6px 18px rgba(0,0,0,.18);
  }
  .midia-tenor { overflow: hidden; background: #fff; }
  .midia-tenor .tenor-gif-embed { width: 100%; }
  h1 {
    font-size: clamp(1.25rem, 5vw, 1.8rem);
    font-weight: 600;
    margin-bottom: 10px;
  }
  .dica {
    min-height: 1.5em;
    color: var(--nao);
    font-weight: 600;
    font-size: .95rem;
    margin-bottom: 18px;
  }
  .botoes {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  button {
    font: inherit;
    font-weight: 700;
    color: #fff;
    border: 0;
    border-radius: 8px;
    padding: 12px 34px;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0, 0, 0, .25);
    transition: transform .15s, left .25s ease, top .25s ease;
  }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  #btnSim { background: var(--sim); font-size: 1.1rem; }
  #btnSim:hover { transform: scale(1.08); }
  #btnNao { background: var(--nao); }
  #espaco { width: 100px; height: 46px; display: none; }

  /* tela de comemoração */
  #final { display: none; }
  #final p { font-size: clamp(.95rem, 3.6vw, 1.1rem); line-height: 1.5; margin-top: 8px; }
  #contagem { margin-top: 14px; font-size: .85rem; opacity: .7; }

  /* confete */
  .confete {
    position: fixed;
    top: -20px;
    z-index: 5;
    pointer-events: none;
    animation: cair linear forwards;
  }
  @keyframes cair {
    to { transform: translate(var(--dx, 0), 110vh) rotate(720deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    .figura { animation: none; }
  }
</style>
</head>

    <p>Prometo te fazer sorrir todos os dias e cuidar de você com todo o meu amor.
       Mal posso esperar para vivermos nossa história juntos!</p>

<script async src="https://tenor.com/embed.js"></script>
<script>
  const VIDEO_URL = "https://youtu.be/GC5Ecs5iIrc?is=sphEjLql2uFR9YVV";
  const ESPERA_SEGUNDOS = 8;

  const btnSim = document.getElementById("btnSim");
  const btnNao = document.getElementById("btnNao");
  const espaco = document.getElementById("espaco");
  const dica = document.getElementById("dica");
  const fundo = document.getElementById("fundo");

  const frases = [
    "Olha lá, hein!", "Quase!", "Errou o botão 😏", "Tá difícil, né?",
    "Esse botão é tímido!", "Tenta o verde 💚", "Não vai rolar!", "Você sabe a resposta 😘"
  ];
  let tentativas = 0;

  /* ---------- BOTÃO NÃO FOGE ---------- */
  function fugir() {
    // deixa um espaço no lugar do botão para o layout não pular
    espaco.style.display = "block";
    btnNao.style.position = "fixed";

    const margem = 10;
    const larguraJanela = window.innerWidth;
    const alturaJanela = window.innerHeight;
    const larguraBtn = btnNao.offsetWidth;
    const alturaBtn = btnNao.offsetHeight;

    const x = margem + Math.floor(Math.random() * (larguraJanela - larguraBtn - margem * 2));
    const y = margem + Math.floor(Math.random() * (alturaJanela - alturaBtn - margem * 2));

    btnNao.style.left = x + "px";
    btnNao.style.top = y + "px";

    dica.textContent = frases[tentativas % frases.length];
    tentativas++;
  }

  // mouse (computador), toque (celular) e teclado
  btnNao.addEventListener("mouseover", fugir);
  btnNao.addEventListener("touchstart", (e) => { e.preventDefault(); fugir(); }, { passive: false });
  btnNao.addEventListener("click", (e) => { e.preventDefault(); fugir(); });
  btnNao.addEventListener("focus", fugir);

  // se a tela mudar de tamanho, mantém o botão visível
  window.addEventListener("resize", () => {
    if (btnNao.style.position === "fixed") fugir();
  });

  /* ---------- CLICOU EM SIM ---------- */
  btnSim.addEventListener("click", () => {
    document.getElementById("pergunta").style.display = "none";
    document.getElementById("final").style.display = "block";
    btnNao.style.display = "none";
    // vídeo estava escondido (display:none): precisa mandar tocar depois de aparecer
    const v2 = document.getElementById("midia2");
    v2.muted = true;
    v2.currentTime = 0;
    v2.play().catch(() => {});
    chuvaDeConfete();

    let restante = ESPERA_SEGUNDOS;
    const contagem = document.getElementById("contagem");
    contagem.textContent = "Tenho uma surpresa pra você em " + restante + "s... 🎁";
    const timer = setInterval(() => {
      restante--;
      if (restante > 0) {
        contagem.textContent = "Tenho uma surpresa pra você em " + restante + "s... 🎁";
      } else {
        clearInterval(timer);
        window.location.href = VIDEO_URL;
      }
    }, 1000);
  });

  /* ---------- FALLBACK DO GIF (se o Tenor não carregar) ---------- */
  setTimeout(() => {
    const caixa = document.getElementById("midia1");
    if (!caixa.querySelector("iframe")) {
      caixa.innerHTML = '<div style="font-size:90px;line-height:1.2;padding:12px">🐻🌹</div>';
    }
  }, 5000);

  /* ---------- EFEITOS ---------- */
  function chuvaDeConfete() {
    const cores = ["#ff4d6d", "#ffb703", "#ff85a1", "#8ecae6", "#b5179e", "#ffd166", "#ffffff"];
    const emojis = ["💖", "💗", "💕", "🌹"];
    const total = 140;
    for (let i = 0; i < total; i++) {
      setTimeout(() => {
        const c = document.createElement("span");
        c.className = "confete";
        if (Math.random() < 0.3) {
          c.textContent = emojis[Math.floor(Math.random() * emojis.length)];
          c.style.fontSize = 16 + Math.random() * 20 + "px";
        } else {
          const w = 6 + Math.random() * 8;
          c.style.width = w + "px";
          c.style.height = w * (0.5 + Math.random()) + "px";
          c.style.background = cores[Math.floor(Math.random() * cores.length)];
          c.style.borderRadius = Math.random() < 0.4 ? "50%" : "2px";
        }
        c.style.left = Math.random() * 100 + "vw";
        c.style.animationDuration = 2.8 + Math.random() * 3.2 + "s";
        c.style.setProperty("--dx", (Math.random() * 160 - 80) + "px");
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 6500);
      }, (i % 70) * 45 + (i >= 70 ? 2500 : 0));
    }
  }

  function novoCoracao() {
    const h = document.createElement("span");
    h.className = "coracao";
    h.textContent = ["❤️", "💗", "💖", "🤍"][Math.floor(Math.random() * 4)];
    h.style.left = Math.random() * 100 + "vw";
    h.style.fontSize = 14 + Math.random() * 26 + "px";
    h.style.animationDuration = 6 + Math.random() * 6 + "s";
    fundo.appendChild(h);
    setTimeout(() => h.remove(), 13000);
  }
  setInterval(novoCoracao, 450);
  for (let i = 0; i < 12; i++) setTimeout(novoCoracao, i * 150);
</script>
